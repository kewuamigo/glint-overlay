[package]
name = "glint-injector"
version = "0.1.0"
description = "Inject overlay and metrics DLLs into target game processes (library used by the launcher)"
edition.workspace = true
license.workspace = true

[lib]
name = "glint_injector"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
glint-overlay-client.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
