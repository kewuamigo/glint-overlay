[package]
name = "glint-overlay-vulkan-layer"
description = "Glint Vulkan layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = false

[dependencies]
glint-overlay-core = { workspace = true }

tracing = "0.1"
once_cell = "1.21.3"
ash = { version = "0.38.0", default-features = false, features = ["std"] }
anyhow = "1.0.97"
scopeguard = "1.2.0"
bytemuck = "1.22.0"
parking_lot = "0.12.3"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
