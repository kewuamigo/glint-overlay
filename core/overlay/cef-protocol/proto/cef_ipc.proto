syntax = "proto3";

package gameoverlay.cef;

// Host ↔ CEF IPC schema (SSOT). Wire payload for MSG_PROTO frames — see design
// docs/superpowers/specs/2026-07-19-host-cef-ipc-design.md
//
// Bump PROTOCOL_VERSION for breaking changes; additive fields/enums stay on the
// same major (never reuse field numbers).
//
// Intentionally dropped from the old JSON op set (do not reintroduce half-wired):
//   - set_size          → use SetInnerBounds / SetSurfaceSize
//   - set_visible       → use SetHidden
//   - HWND / hwnd fields on create/set_bounds → OSR-only until a future SessionMode

// ---------------------------------------------------------------------------
// Protocol version
// ---------------------------------------------------------------------------

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

// ---------------------------------------------------------------------------
// Envelope — every MSG_PROTO payload is one Envelope
//
// Reserved oneof field-number ranges (do not reuse; leave gaps for growth):
//   1–9:    Envelope header fields (protocol_version, correlation_id, …)
//   10–19:  handshake / errors (Hello, HelloAck, Error, …)
//   20–39:  host → CEF control / session / navigation
//   40–49:  host → CEF input (hot path)
//   50–69:  CEF → host (ready, paint, nav, chrome UI actions, …)
//   70–89:  reserved — audio / media
//   90–109: reserved — IME compose / text input extras
//   110–129: reserved — multi-tab / multi-browser session ids
//   130–149: reserved — HWND / alternate session modes
// ---------------------------------------------------------------------------

message Envelope {
  ProtocolVersion protocol_version = 1;
  // Monotonic per-connection id for request/response pairing (0 = no reply expected).
  uint32 correlation_id = 2;

  oneof body {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    Error error = 12;

    // Host → CEF (control)
    CreateSession create_session = 20;
    Shutdown shutdown = 21;
    SetSurfaceSize set_surface_size = 22;
    SetInnerBounds set_inner_bounds = 23;
    SetFocus set_focus = 24;
    SetHidden set_hidden = 25;
    Navigate navigate = 26;
    ContentNavigate content_navigate = 27;
    GoBack go_back = 28;
    GoForward go_forward = 29;
    Reload reload = 30;
    BridgeResult bridge_result = 31;
    BridgePush bridge_push = 32;
    // Arbitrary content OSR hole inside fullscreen shell chrome (React BrowserPanel).
    SetContentRect set_content_rect = 33;
    // Chrome-style extension satellite (popup/options) — never touches content_ OSR.
    OpenExtensionSatellite open_extension_satellite = 34;
    CloseExtensionSatellite close_extension_satellite = 35;

    // Host → CEF (input — hot path)
    KeyEvent key_event = 40;
    MouseEvent mouse_event = 41;
    WheelEvent wheel_event = 42;

    // CEF → Host
    Ready ready = 50;
    Paint paint = 51;
    PaintError paint_error = 52;
    NavState nav_state = 53;
    HostUiAction host_ui_action = 54; // chrome JS → host (move/close/…)
    BridgeInvoke bridge_invoke = 55;  // page `__goHost.invoke` → host
  }
}

// ---------------------------------------------------------------------------
// Core enums
// ---------------------------------------------------------------------------

enum FocusTarget {
  FOCUS_TARGET_UNSPECIFIED = 0;
  FOCUS_TARGET_CHROME = 1;   // chrome OSR (fullscreen UI)
  FOCUS_TARGET_CONTENT = 2;  // content OSR (page)
}

enum KeyEventType {
  KEY_EVENT_TYPE_UNSPECIFIED = 0;
  KEY_EVENT_TYPE_RAW_DOWN = 1;  // CEF KEYEVENT_RAWKEYDOWN
  KEY_EVENT_TYPE_KEY_DOWN = 2;  // CEF KEYEVENT_KEYDOWN
  KEY_EVENT_TYPE_KEY_UP = 3;
  KEY_EVENT_TYPE_CHAR = 4;
}

enum MouseEventType {
  MOUSE_EVENT_TYPE_UNSPECIFIED = 0;
  MOUSE_EVENT_TYPE_MOVE = 1;
  MOUSE_EVENT_TYPE_DOWN = 2;
  MOUSE_EVENT_TYPE_UP = 3;
  MOUSE_EVENT_TYPE_LEAVE = 4;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_MIDDLE = 2;
  MOUSE_BUTTON_RIGHT = 3;
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_OSR = 1;
  // SESSION_MODE_HWND reserved for a future mode — do not half-wire HWND now.
}

// Chrome UI → host actions. Enum only — no free-string action field.
enum HostUiActionKind {
  HOST_UI_ACTION_KIND_UNSPECIFIED = 0;
  HOST_UI_ACTION_KIND_CLOSE = 1;
  HOST_UI_ACTION_KIND_MOVE = 2;
  HOST_UI_ACTION_KIND_MINIMIZE = 3;
  HOST_UI_ACTION_KIND_SET_BOUNDS = 4;
}

// ---------------------------------------------------------------------------
// Handshake / errors
// ---------------------------------------------------------------------------

// Empty bodies: negotiated version is Envelope.protocol_version only (not here).
// CEF → host after TCP connect.
message Hello {}

// Host → CEF: accept/reject via Envelope.protocol_version (or close if incompatible).
message HelloAck {}

message Error {
  // Convenience echo of the request id. Envelope.correlation_id is authoritative
  // for pairing; this field may duplicate it for handlers that only inspect Error.
  uint32 correlation_id = 1;
  string code = 2;           // stable machine code, e.g. "UNSUPPORTED_VERSION"
  string message = 3;        // human
}

// ---------------------------------------------------------------------------
// Session / surface / navigation (host → CEF)
// ---------------------------------------------------------------------------

message CreateSession {
  uint32 width = 1;
  uint32 height = 2;
  string url = 3;
  SessionMode mode = 4; // v1: OSR only
}

message Shutdown {
  // true  = quit CEF message loop (old JSON op "shutdown")
  // false = destroy browsers only (old JSON op "close")
  bool quit_message_loop = 1;
}

message SetSurfaceSize {
  uint32 width = 1;
  uint32 height = 2;
}

message SetInnerBounds {
  int32 x = 1;
  int32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 layout_generation = 5; // host-monotonic; 0 = legacy/ignore
}

message SetFocus {
  bool focus = 1;
  FocusTarget target = 2;
}

message SetHidden {
  bool hidden = 1;
}

message Navigate {
  string url = 1;
}

message ContentNavigate {
  string url = 1;
}

// Content OSR placement inside the shared texture (shell React hole).
// clear=true → drop override (no content composite until next navigate).
message SetContentRect {
  bool clear = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message GoBack {}

message GoForward {}

message Reload {}

// Chrome-style windowed satellite for extension options / action popup.
// Fail closed in CEF: never clear chrome_/content_ OSR on satellite errors.
enum ExtensionSatelliteKind {
  EXTENSION_SATELLITE_KIND_UNSPECIFIED = 0;
  EXTENSION_SATELLITE_KIND_OPTIONS = 1;
  EXTENSION_SATELLITE_KIND_POPUP = 2;
}

message OpenExtensionSatellite {
  // Folder name under %APPDATA%/Glint/BrowserExtensions (not chrome-extension id).
  string extension_id = 1;
  ExtensionSatelliteKind kind = 2;
}

message CloseExtensionSatellite {}

// ---------------------------------------------------------------------------
// Input (host → CEF)
//
// Stateless modifiers: every KeyEvent / MouseEvent / WheelEvent carries a full
// `modifiers` bitmask matching CEF EVENTFLAG_* (cef_types.h). Host must emit
// the full mask on every message — do not rely on sticky remembered Ctrl/Shift/Alt
// as the sole source of truth.
//
// CEF EVENTFLAG_* bit mapping (uint32 modifiers):
//   bit 0  (1 << 0)  EVENTFLAG_CAPS_LOCK_ON
//   bit 1  (1 << 1)  EVENTFLAG_SHIFT_DOWN
//   bit 2  (1 << 2)  EVENTFLAG_CONTROL_DOWN
//   bit 3  (1 << 3)  EVENTFLAG_ALT_DOWN
//   bit 4  (1 << 4)  EVENTFLAG_LEFT_MOUSE_BUTTON
//   bit 5  (1 << 5)  EVENTFLAG_MIDDLE_MOUSE_BUTTON
//   bit 6  (1 << 6)  EVENTFLAG_RIGHT_MOUSE_BUTTON
//   bit 7  (1 << 7)  EVENTFLAG_COMMAND_DOWN   (Mac)
//   bit 8  (1 << 8)  EVENTFLAG_NUM_LOCK_ON
//   bit 9  (1 << 9)  EVENTFLAG_IS_KEY_PAD
//   bit 10 (1 << 10) EVENTFLAG_IS_LEFT
//   bit 11 (1 << 11) EVENTFLAG_IS_RIGHT
//   bit 12 (1 << 12) EVENTFLAG_ALTGR_DOWN
//   bit 13 (1 << 13) EVENTFLAG_IS_REPEAT       (when present in CEF)
//
// Explicit focus target: every input message includes FocusTarget. Host decides
// chrome vs content; CEF must not guess.
// ---------------------------------------------------------------------------

message KeyEvent {
  KeyEventType type = 1;
  FocusTarget target = 2;
  uint32 modifiers = 3;          // CEF EVENTFLAG_* bitmask (see above)
  uint32 windows_key_code = 4;   // VK_
  uint32 native_key_code = 5;
  bool is_system_key = 6;
  string character = 7;          // for CHAR; UTF-8, usually one codepoint
  // Optional future: uint32 scan_code = 8; bool is_repeat = 9;
}

// Mouse coordinates are in the *target* OSR view space:
//   FOCUS_TARGET_CHROME:  (x,y) = surface / game client space (fullscreen chrome OSR).
//   FOCUS_TARGET_CONTENT: (x,y) = content view space (hole-local; y already minus chrome top).
message MouseEvent {
  MouseEventType type = 1;
  FocusTarget target = 2;
  uint32 modifiers = 3;
  MouseButton button = 4;        // meaningful for down/up
  int32 x = 5;
  int32 y = 6;
  uint32 click_count = 7;
}

message WheelEvent {
  FocusTarget target = 1;
  uint32 modifiers = 2;
  int32 x = 3;
  int32 y = 4;
  int32 delta_x = 5;
  int32 delta_y = 6;
}

// ---------------------------------------------------------------------------
// CEF → host
// ---------------------------------------------------------------------------

message Ready {
  uint32 chrome_top_px = 1; // SSOT from CEF for host hit-test
}

message Paint {
  uint32 width = 1;
  uint32 height = 2;
  // Shared texture NT handle (cross-process). Must remain uint64.
  uint64 nt_handle = 3;
  uint32 layout_generation = 4; // echo of last applied SetInnerBounds gen
  // 0 = chrome, 1 = content. optional so proto3 0 is not "unset" (legacy).
  optional uint32 layer = 5;
}

message PaintError {
  string message = 1;
}

// Mirrors live EmitNavState / chrome __goApplyNavState (all five fields).
message NavState {
  string url = 1;
  string title = 2;
  bool loading = 3;
  bool can_go_back = 4;
  bool can_go_forward = 5;
}

message HostUiAction {
  HostUiActionKind kind = 1;
  int32 dx = 2;
  int32 dy = 3;
  int32 dw = 4;
  int32 dh = 5;
}

// ---------------------------------------------------------------------------
// App bridge (`__goHost`) — carries the invoke/push contract of
// specs/002-cef-overlay-host/contracts/host-bridge.md. Payloads stay JSON:
// the app-facing API is method strings + JSON values, not protobuf.
// ---------------------------------------------------------------------------

message BridgeInvoke {
  uint32 request_id = 1;  // page-local; echoed in BridgeResult
  string method = 2;
  string args_json = 3;   // JSON array
  string plugin_id = 4;   // empty = host method
}

message BridgeResult {
  uint32 request_id = 1;
  bool ok = 2;
  string result_json = 3; // JSON value; empty = undefined
  string error = 4;       // set when ok = false
}

message BridgePush {
  string message_json = 1; // UiMessage object; delivered as window.postMessage
}
