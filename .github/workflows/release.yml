name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart("v")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package release
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 -Version "${{ steps.ver.outputs.version }}" -PortableZip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Glint v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/release/Glint-Setup-${{ steps.ver.outputs.version }}.exe
            dist/release/Glint-portable-${{ steps.ver.outputs.version }}.zip